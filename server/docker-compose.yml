version "3.8"

services:
  db:
    container_name:"dciDB"
    image: postgres12.4-alpine
    volumes:
      - "./database/postgres-data:/var/lib/postgressql/data:rw"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    restart: unless-stopped
    